[package]
name = "deskhand-mcp"
description = "MCP client: connects to configured MCP servers and exposes their tools through the DeskHand toolbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
deskhand-policy.workspace = true
deskhand-tools.workspace = true
rmcp = { version = "3.8.0", default-features = false, features = ["client", "transport-child-process"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "process", "time", "sync"] }

[lints]
workspace = true

[dev-dependencies]
rmcp = { version = "3.8.0", features = ["server", "macros", "schemars", "client", "transport-async-rw"] }
schemars = "1.2.3"
tokio = { version = "1.54.1", features = ["macros"] }
