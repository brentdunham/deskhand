[package]
name = "deskhand-agent"
description = "Model provider adapters and the tool-use loop for DeskHand"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
deskhand-policy.workspace = true
deskhand-tools.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true

# Windows: TLS via SChannel (native-tls). Uses the OS certificate store, so
# corporate proxy and inspection certificates work, and needs no C toolchain.
# (reqwest's default TLS backend, aws-lc-rs, needs CMake and NASM to build.)
[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = [
    "native-tls",
    "http2",
    "system-proxy",
    "stream",
    "json",
] }

# Non-Windows builds exist only to run tests, which never make HTTP calls.
[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros"] }

[lints]
workspace = true
