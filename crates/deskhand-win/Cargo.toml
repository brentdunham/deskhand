[package]
name = "deskhand-win"
description = "Win32, UI Automation, window management, and hotkey bindings for DeskHand"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Exposes `test_support::TestWindow` for other crates' tests. Never enable in
# production builds.
test-support = []

[dependencies]
base64 = "0.23.1"
png = "0.18.1"
serde.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Storage_Xps",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_HiDpi"] }

# This is the only crate permitted to contain unsafe code, so it does not
# inherit the workspace `unsafe_code = "forbid"` lint.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
